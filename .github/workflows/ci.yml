# This repository had NO CI at all — no workflow, no scripts, no gate of any
# kind — while being the design SSOT that OrangeCat, FleetCrown and Solon all
# consume. A change here reaches every one of them, and nothing checked it.
#
# One job, one command. `npm run verify` is defined once in package.json and
# called here verbatim, so "green locally" and "green in CI" cannot mean two
# different things. Do not re-inline the gates: a hand-copied gate list is how
# botsmann silently lost its typecheck.
name: CI

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run verify
